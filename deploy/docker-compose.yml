services:
  app:
    image: ghcr.io/joaosp7/pokemon-card-collector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      # Bancos SQLite (catalog.db, ownership.db) e imagens das cartas ficam no host.
      # Pastas devem pertencer ao uid 1000 (usuario "node" do container).
      - ./data:/app/data
      - ./cards:/app/cards
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
