name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Opcional (rollback): SHA/tag ja publicada no GHCR para implantar, sem novo build"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/joaosp7/pokemon-card-collector

jobs:
  build:
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_SHA}"
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
            echo "image_tag invalida" >&2; exit 1
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # Tailscale SSH: sem chave privada. A autenticacao e a ACL "ssh" da tailnet
      # (src tag:ci -> dst tag:server). A identidade do host ja e garantida pelo
      # tunel WireGuard, entao nao usamos known_hosts.
      - name: Copy deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10)
          for i in 1 2 3 4 5; do
            # tar via ssh (nao depende de scp/sftp no Tailscale SSH)
            if tar -C deploy -cf - docker-compose.yml remote-deploy.sh \
              | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/app && tar -C ~/app -xf -'; then
              break
            fi
            [ "$i" = 5 ] && exit 1
            echo "ssh tentativa $i falhou"; sleep 5
          done

      - name: Deploy (com healthcheck e rollback automatico)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10)
          # IMAGE_TAG (SHA/tag validada) e GHCR_USER expandem no cliente de proposito.
          # shellcheck disable=SC2029
          # O token vai por stdin (nao aparece na linha de comando do servidor).
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash ~/app/remote-deploy.sh '$IMAGE_TAG' '$GHCR_USER'"
